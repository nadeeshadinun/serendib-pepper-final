<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
  <meta content="mobile_tab" name="shell-type"/>

  <!-- Premium Luxury Typography Imports -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Noto+Serif+Sinhala:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Font-Face Icons Utility Layout Sheet -->
  <style>
    @font-face {
      font-family: 'Material Symbols Outlined';
      font-style: normal;
      font-weight: 100 700;
      src: url(https://gstatic.com/s/materialsymbolsoutlined/v375/kJF1BvYX7BgnkSrUwT8OhrdQw4oELdPIeeII9v6oDMzByHX9rA6RzaxHMPdY43zj-jCxv3fzvRNU22ZXGJpEpjC_1v-p_4MrImHCIJIZrDCvHeem.ttf) format('truetype');
    }
    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined';
      font-weight: normal;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      display: inline-block;
      direction: ltr;
    }
  </style>

  <script src="https://tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = { 
      darkMode: "class", 
      theme: { 
        extend: { 
          colors: { 
            "surface-container-low": "#f6f3ec", "tertiary-fixed": "#ffdcbf", "tertiary-container": "#2d1600", 
            "surface-variant": "#e5e2db", "error-container": "#ffdad6", "on-background": "#1c1c18", 
            "surface-bright": "#fcf9f2", "surface-dim": "#dcdad3", "surface-container-high": "#ebe8e1", 
            "on-secondary-fixed-variant": "#005322", "surface-tint": "#5c5f5b", "on-surface-variant": "#444843", 
            "surface-container-lowest": "#ffffff", "primary-container": "#191c19", "surface-container": "#f1eee7", 
            "on-secondary-container": "#007232", "surface": "#fcf9f2", "on-tertiary-container": "#a87b4f", 
            "inverse-surface": "#31312c", "outline": "#757873", "tertiary-fixed-dim": "#f1bc8c", 
            "on-error": "#ffffff", "error": "#ba1a1a", "primary-fixed": "#e1e3de", "surface-container-highest": "#e5e2db", 
            "on-secondary-fixed": "#002109", "on-primary-fixed-variant": "#454844", "inverse-primary": "#c5c7c2", 
            "primary-fixed-dim": "#c5c7c2", "on-primary-container": "#828580", "inverse-on-surface": "#f3f0e9", 
            "on-primary-fixed": "#191c19", "secondary-fixed-dim": "#3de273", "on-primary": "#ffffff", 
            "on-surface": "#1c1c18", "on-tertiary-fixed-variant": "#633f19", "on-tertiary": "#ffffff", 
            "background": "#fcf9f2", "secondary-fixed": "#66ff8e", "primary": "#000000", "secondary": "#006d2f", 
            "tertiary": "#000000", "on-tertiary-fixed": "#2d1600", "on-error-container": "#93000a", 
            "secondary-container": "#5dfd8a", "on-secondary": "#ffffff", "outline-variant": "#c5c7c2" 
          }
        } 
      } 
    };
  </script>

  <!-- Premium Brand Style Overrides Framework -->
  <style>
    @layer base {
      html, body {
        width: 100vw;
        margin: 0;
        padding: 0;
      }
      
      body {
        overscroll-behavior: none;
        font-family: 'Plus Jakarta Sans', sans-serif;
        
        /* Premium Luxury Background Texture Depth */
        background-color: #f6f4ee !important; 
        background-image: 
          radial-gradient(rgba(0, 0, 0, 0.035) 1px, transparent 0),
          radial-gradient(rgba(0, 0, 0, 0.015) 1px, transparent 0) !important;
        background-size: 24px 24px, 12px 12px !important;
        color: #222222;
        overflow-x: hidden;
      }

      /* Luxury Sinhala & English Headings Upgrade */
      h1, h2, h3, .font-label-sinhala-lead {
        font-family: 'Noto Serif Sinhala', 'Playfair Display', serif !important;
        font-weight: 800 !important;
        letter-spacing: -0.01em !important;
        color: #111111 !important;
      }

      /* Re-styling Flat Grids Into High-End Soft Packaging Cards */
      section, aside, .card-box {
        background: #ffffff !important;
        border: 1px solid rgba(139, 92, 26, 0.07) !important;
        border-radius: 28px !important;
        box-shadow: 
          0 4px 20px rgba(139, 92, 26, 0.01),
          0 16px 38px rgba(0, 0, 0, 0.03) !important;
        margin: 20px 16px !important;
        padding: 40px 24px !important;
      }

      /* Make Upper Hero Minimalist & Clean (Removes Plain Aggressive Green Backdrop) */
      .hero-clean-slate {
        background: radial-gradient(circle at center, #ffffff 0%, #FAF8F5 100%) !important;
        border: none !important;
        box-shadow: none !important;
        margin: 0 !important;
        padding: 40px 20px !important;
      }

      /* Micro-Interactions: Smooth Entrance Reveal Animation Setup */
      .reveal-on-scroll {
        opacity: 0;
        transform: translateY(35px);
        transition: all 0.9s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .reveal-on-scroll.active {
        opacity: 1;
        transform: translateY(0);
      }

      @media (max-width: 768px) {
        /* Add balanced alignment vertical layout room for small phone devices */
        .flex-col, .grid {
          gap: 40px !important; 
        }
        p, span {
          font-size: 17px !important;
          line-height: 1.65 !important;
        }
        main img {
          border-radius: 20px !important;
          box-shadow: 0 15px 35px rgba(0,0,0,0.06) !important;
        }
      }

      .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
      .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
      main>:first-child { margin-top: 0!important; }
      main>:last-child { margin-bottom: 0!important; }
    }
    ::-webkit-scrollbar { display: none; }
  </style>
</head>

<body class="bg-surface font-body-md text-body-md text-on-surface flex flex-col min-h-screen">
  
  <!-- BRAND NAVIGATION HEADER HEADER -->
  <header class="fixed top-0 w-full z-50 pt-safe bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.03)]">
    <div class="h-16 px-6 flex items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <img alt="Serendib Brand Logo" class="h-9 w-auto object-contain rounded-md" src="https://googleusercontent.com"/>
        <div class="flex flex-col">
          <span class="font-headline-sm text-[15px] font-extrabold tracking-tight text-neutral-900 uppercase">Serendib Pepper</span>
          <span class="font-body-sm text-[11px] leading-tight text-neutral-500 font-semibold">Delkanda • Nugegoda</span>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <a aria-label="Call Store" class="w-11 h-11 flex items-center justify-center rounded-full text-neutral-600 hover:bg-neutral-100 active:scale-95 transition-all" href="tel:0777511933">
          <span class="material-symbols-outlined text-[24px]">call</span>
        </a>
        <a aria-label="WhatsApp Store" class="w-11 h-11 flex items-center justify-center rounded-full bg-emerald-600 text-white shadow-md hover:opacity-95 active:scale-95 transition-all" href="https://wa.me" rel="noopener" target="_blank">
          <span class="material-symbols-outlined text-[22px]">chat</span>
        </a>
      </div>
    </div>
  </header>

  <!-- MAIN PAGE LAYOUT CORE -->
  <main class="flex-1 flex flex-col relative w-full pt-16 pb-32 bg-transparent">
    <div class="flex flex-col w-full">
      
      <!-- 1. ISLANDWIDE BANNER TICKER -->
      <aside class="bg-neutral-900 text-white py-2.5 px-6 flex items-center justify-between overflow-hidden shadow-sm rounded-none border-none m-0">
        <div class="flex items-center gap-2 shrink-0">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span class="font-label-tag text-[10px] tracking-wider uppercase text-emerald-400 font-bold">Islandwide Delivery</span>
        </div>
        <div class="overflow-x-auto no-scrollbar whitespace-nowrap pl-4 flex items-center gap-6 text-[12px] text-neutral-300 font-medium">
          <span>100% Organic Ceylon Pepper</span>
          <span class="text-neutral-600">/</span>
          <span>Direct Delkanda Dispatch</span>
          <span class="text-neutral-600">/</span>
          <span class="text-emerald-400 font-bold">550+ GL Density</span>
          <span class="text-neutral-600">/</span>
          <span>Cash on Delivery (COD)</span>
        </div>
      </aside>

      <!-- 2. LUXURY UPPER HERO BACKDROP SECTION -->
      <section class="hero-clean-slate flex flex-col gap-6">
        <div class="flex flex-col gap-2">
          <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-neutral-100 text-neutral-700 font-medium text-[11px] self-start shadow-sm">
            <span class="material-symbols-outlined text-[14px] text-emerald-600 font-bold">verified</span>
            <span>Single-Origin Grade 1 • දෙල්කඳ</span>
          </div>
          <h1 class="font-label-sinhala-lead text-3xl md:text-5xl text-neutral-900 tracking-tight mt-2 leading-tight">
            පිරිසිදු ශ්‍රී ලාංකික ගම්මිරිස්
          </h1>
          <p class="text-neutral-500 text-[15px] font-medium leading-relaxed max-w-xl">
